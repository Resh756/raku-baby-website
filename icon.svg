<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="100%" stop-color="#141624" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bg-grad)" stroke="#00f0ff" stroke-width="4" />
  
  <!-- Geometric Tech Accents -->
  <path d="M 64 64 L 128 64 L 64 128 Z" fill="#00f0ff" opacity="0.3" />
  <path d="M 448 448 L 384 448 L 448 384 Z" fill="#ff0055" opacity="0.3" />
  
  <!-- Crown/Gate Symbol -->
  <path d="M 156 180 L 256 100 L 356 180 L 316 340 L 256 300 L 196 340 Z" 
        fill="none" stroke="url(#neon-glow)" stroke-width="8" filter="url(#glow)" stroke-linejoin="round" />
        
  <!-- Core Inner Crystal -->
  <polygon points="256,150 290,230 256,270 222,230" fill="#00f0ff" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Main Text -->
  <text x="256" y="420" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" 
        fill="#00f0ff" text-anchor="middle" letter-spacing="4" filter="url(#glow)">
    R _ D
  </text>
  
  <text x="256" y="460" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" 
        fill="#ff0055" text-anchor="middle" letter-spacing="6">
    SYSTEM
  </text>
</svg>
